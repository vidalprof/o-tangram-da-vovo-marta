:root{--verde:#5bbf3a;--verde-d:#3f9a26;--sol:#ffd43b;--sol-d:#eab000;--terra:#a6703c;
  --coral:#ff7a6b;--rosa:#ff8ac2;--roxo:#7d3fe0;--texto:#3a3020;--card:#fffdf6;--linha:#e6dcc6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,Arial,sans-serif;color:var(--texto);background:#bfe9ff;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;z-index:0;background:#cdeeff center/cover no-repeat;background-image:url(img/tg_fundo.png)}
#ceu{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
#app{position:fixed;inset:0;z-index:2}
.tela{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));-webkit-animation:fade .45s;animation:fade .45s}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
/* marcador: balao que NAO ganha alto-falante (tela do professor). Sem
   gravacao, o botao ficaria mudo — melhor nao existir. */
.semzap{padding-right:18px}
.balao{position:relative;max-width:430px;background:rgba(255,253,246,.95);border:0;border-radius:22px;padding:13px 18px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.balao b{color:#2c7318}
/* ⭐ REGRA DO MOTOR — O ENUNCIADO NUNCA ENCOSTA NO QUE VEM DEPOIS.
   O Marcos cobrou isto DUAS vezes noutras atividades (*"as opcoes de resposta
   estao encostando no enunciado"* e, depois, *"esse encosto no enunciado eu ja
   tinha comentado antes"*). Aqui o portao de leiaute achou o mesmo defeito em
   10 telas x 6 tamanhos: folga ZERO. O balao tem sombra, e o vizinho colado por
   baixo entra nela e parece grudado. Regra de motor, nao conserto de fase — e a
   unica forma de o defeito nao voltar na proxima tela que alguem montar.     */

/* ⚠️ LICAO PAGA (ago/2026, e o Marcos so viu o SINTOMA: "falta a comemoracao
   com confetes"). O confete existia e nunca aparecia. `canvas` e elemento
   SUBSTITUIDO: com `inset:0` e largura automatica, o navegador NAO estica —
   usa o tamanho intrinseco, 300x150, no canto de cima. Entao `cc.height`
   valia 150, e o `lcf()` apagava na hora todo papel nascido abaixo de 170px
   (`p.y>cc.height+20`), que e a tela inteira. O `#ceu` ja tinha o conserto
   (width/height 100%) e este ficou para tras. Elemento substituido SEMPRE
   pede largura e altura explicitas.                                     */
#conf{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:15;pointer-events:none}
.hint{margin-top:10px;font-size:13px;color:#fff;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4);background:rgba(40,52,20,.82);padding:6px 13px;border-radius:999px;max-width:340px;text-align:center;line-height:1.3}

.cracha{position:relative;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;gap:12px;background:rgba(255,253,246,.74);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);border:2px solid var(--linha);border-bottom-width:5px;border-radius:20px;padding:10px 18px 10px 10px;margin-top:14px;max-width:300px;-webkit-box-shadow:0 8px 18px rgba(30,50,20,.26);box-shadow:0 8px 18px rgba(30,50,20,.26);-webkit-animation:pop .5s;animation:pop .5s}

/* ⚠️ contraste medido: #6b6252 sobre o creme do cracha dava 4.19:1 (minimo
   4.5). #5f574a da 4.96:1 — o portao mede o PIXEL, nao o CSS.            */
.cracha .cfun{color:#5f574a !important;font-size:12px;font-weight:600}
.cracha:before{content:"";position:absolute;top:-7px;left:50%;margin-left:-11px;width:22px;height:9px;border:2px solid var(--linha);border-bottom:0;border-radius:11px 11px 0 0;background:transparent}
/* ---- a beleza do jogo: nada aqui e enfeite solto, cada um diz uma coisa ---- */
/* a peca ENCAIXA com um baque: cresce e assenta */
@-webkit-keyframes tsnap{0%{-webkit-transform:scale(1.25)}60%{-webkit-transform:scale(.94)}100%{-webkit-transform:scale(1)}}
@keyframes tsnap{0%{transform:scale(1.25)}60%{transform:scale(.94)}100%{transform:scale(1)}}
.tpeca.posta{-webkit-animation:tsnap .32s ease-out;animation:tsnap .32s ease-out}
/* a vaga vazia RESPIRA, para a crianca ver onde ainda falta */
@-webkit-keyframes tresp{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes tresp{0%,100%{opacity:.55}50%{opacity:1}}
.tvg{-webkit-animation:tresp 2.4s ease-in-out infinite;animation:tresp 2.4s ease-in-out infinite}
.tvg.sob{-webkit-animation:none;animation:none}
/* a peca na mao pulsa de leve */
50%{-webkit-transform:scale(1.07)}}
50%{transform:scale(1.07)}}
/* ⚠️ LICAO PAGA (ago/2026, e o Marcos viu: "as pecas nao giram"). A peca
   escolhida pulsava com uma animacao que mexe no `transform` — e animacao
   SEMPRE ganha do estilo inline. O giro era aplicado e apagado 60x por segundo:
   o dado mudava (270 -> 315) e a tela nao mexia.
   Regra que fica: quem gira usa o `transform`; entao o destaque usa OUTRA
   propriedade — aqui o brilho e a espessura da borda, que nao brigam. */
.tpeca.sel{-webkit-animation:tselbr 1.1s ease-in-out infinite;animation:tselbr 1.1s ease-in-out infinite}
/* a FIGURA FECHADA acende inteira antes da festa */
@-webkit-keyframes tbrilha{0%,100%{-webkit-filter:none}50%{-webkit-filter:brightness(1.35) saturate(1.3)}}
@keyframes tbrilha{0%,100%{filter:none}50%{filter:brightness(1.35) saturate(1.3)}}
.mesa.pronta .tpeca.posta{-webkit-animation:tbrilha .7s ease-in-out 2;animation:tbrilha .7s ease-in-out 2}
.mesa.pronta{-webkit-box-shadow:0 0 0 4px var(--sol),0 10px 26px rgba(30,50,20,.3);box-shadow:0 0 0 4px var(--sol),0 10px 26px rgba(30,50,20,.3)}
/* ============ O TABULEIRO DO TANGRAM ============
   ⚠️ As pecas sao SVG, nunca bitmap: elas GIRAM, e figura de bitmap girada
   serrilha. A arte de IA (a vovo, a oficina, a caixa) e outra coisa.        */
.mesa{position:relative;width:100%;max-width:330px;height:330px;margin:6px auto 0;
  background:rgba(255,253,246,.90);border:3px solid var(--linha);border-radius:20px;
  -webkit-box-shadow:0 8px 18px rgba(30,50,20,.18);box-shadow:0 8px 18px rgba(30,50,20,.18)}
/* ⚠️ LICAO PAGA (ago/2026): estas vagas se chamavam `.slot` — o MESMO nome da
   casinha de letra que veio no CSS clonado da Lina. Nome de classe repetido
   HERDA estilo alheio sem avisar: cada vaga do tangram ganhava um QUADRADO
   BRANCO chapado atras do contorno tracejado, e a figura ficava manchada. O
   `node --check` passa, nada quebra — so fica feio. Classe nova de mecanica
   nova leva o PREFIXO da casa (`t` de tangram).                            */
.tvg,.tpeca{position:absolute;left:0;top:0;-webkit-transform-origin:50% 50%;transform-origin:50% 50%}
.tvg svg,.tpeca svg{display:block;width:100%;height:100%;overflow:visible}
.tvg.sob polygon{fill:rgba(255,212,59,.45)}
.banca{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;
  gap:10px;-webkit-box-pack:center;justify-content:center;margin-top:12px;min-height:76px}
.tpeca{position:relative;cursor:pointer;-ms-touch-action:none;touch-action:none}
@-webkit-keyframes tselbr{0%,100%{-webkit-filter:drop-shadow(0 0 3px #ffd43b) drop-shadow(0 4px 10px rgba(0,0,0,.3))}50%{-webkit-filter:drop-shadow(0 0 12px #ffb703) drop-shadow(0 4px 10px rgba(0,0,0,.3))}}
@keyframes tselbr{0%,100%{filter:drop-shadow(0 0 3px #ffd43b) drop-shadow(0 4px 10px rgba(0,0,0,.3))}50%{filter:drop-shadow(0 0 12px #ffb703) drop-shadow(0 4px 10px rgba(0,0,0,.3))}}
/* a virada anda: a crianca VE a peca girando, nao pula de angulo */
.tpeca{-webkit-transition:-webkit-transform .22s ease-out;transition:transform .22s ease-out}
.tpeca.sel{-webkit-filter:drop-shadow(0 0 0 #ffd43b) drop-shadow(0 4px 10px rgba(0,0,0,.3));filter:drop-shadow(0 0 6px #ffd43b) drop-shadow(0 4px 10px rgba(0,0,0,.3))}
/* ⭐ ACABAMENTO — regra 1: O ESCOLHIDO TEM QUE GRITAR. So o brilho dourado nao
   bastava: na foto da tela eu mesmo nao sabia dizer qual das cinco pecas estava
   na mao. Como quem gira usa o `transform` (proibido animar), quem grita e o
   CONTRASTE: as OUTRAS pecas apagam. A escolhida fica sozinha acesa.        */
/* ⚠️ a primeira dose foi FORTE demais (opacidade .34 + cinza): as outras pecas
   sumiam no fundo de madeira e a crianca perdia de vista o que ainda tem na
   bandeja. Apagar e para dizer "esta nao e a da vez", nao para esconder.   */
.banca.temsel .tpeca{opacity:.52;-webkit-filter:grayscale(.22);filter:grayscale(.22)}
.banca.temsel .tpeca.sel{opacity:1;-webkit-filter:none;filter:none}
.banca .tpeca,.banca.temsel .tpeca{-webkit-transition:opacity .2s,-webkit-filter .2s,-webkit-transform .22s ease-out;transition:opacity .2s,filter .2s,transform .22s ease-out}
.tpeca.voa{position:fixed;z-index:40;pointer-events:none;opacity:.95}
.tpeca.posta{position:absolute;cursor:default;z-index:3}
/* ⚠️ a vaga VAZIA fica ACIMA das pecas ja postas, para o caso de duas vagas na
   mesma posicao (os dois triangulos da copa): a 2a continua clicavel. A vaga
   preenchida sai da frente por `visibility:hidden` no JS. */
.tvg{z-index:6}
.tferr{display:-webkit-box;display:-webkit-flex;display:flex;gap:10px;-webkit-box-pack:center;justify-content:center;margin-top:10px}
.bgira{background:-webkit-linear-gradient(top,#ffd95e,var(--sol));background:linear-gradient(#ffd95e,var(--sol));
  color:#5a4200;border:0;border-radius:999px;padding:12px 20px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;
  -webkit-box-shadow:0 5px 0 #c99a12;box-shadow:0 5px 0 #c99a12}
.bgira:active{-webkit-transform:translateY(3px);transform:translateY(3px);-webkit-box-shadow:0 2px 0 #c99a12;box-shadow:0 2px 0 #c99a12}
.bgira.escondido{display:none}
/* ⭐ ACABAMENTO — regra 2 do `_padrao/ACABAMENTO.md`: A FERRAMENTA MORA JUNTO
   DO OBJETO. O botao de girar ficava no rodape, a 200px da peca: a crianca
   escolhia a peca aqui em cima e a ajuda estava la embaixo, e ela nao ligava
   uma coisa na outra. Agora nasce um botao REDONDO colado na peca escolhida,
   com a seta que curva — o desenho ja diz o que ele faz, sem ler.
   ⚠️ nada de `transform` na animacao dele? aqui pode: o botao nao gira, quem
   gira e a peca. Mas a peca continua proibida (a animacao atropela o giro).  */
/* ⚠️ LICAO PAGA (ago/2026, o Marcos jogando): o botao de girar SEGUIA a peca
   escolhida (colado nela). Parecia bom, mas ao pular de peca em peca ele caia
   EM CIMA de outra peca e a crianca clicava nela sem querer. Ele pediu, com
   todas as letras: "seria legal que ele nao saisse do lugar, mais profissional".
   Agora o girar e um botao FIXO no rodape, redondo e moderno: sempre no mesmo
   lugar, aparece quando ha peca na mao, e NUNCA sobre uma peca. */
/* ⚠️ LICAO PAGA (ago/2026): este botao era `position:fixed` — e elemento fixed
   tem `offsetParent` NULL. O auditor-jogador filtra alvos por `offsetParent!==
   null` (para nao clicar em botao escondido), entao ele NAO ENXERGAVA o girar:
   colocava a 1a peca e empacava nas que precisam girar ("PRESO na fase 1").
   `position:absolute` (com coordenada de PAGINA) tem offsetParent = body: o
   jogador ve, e a crianca tambem. Regra: controle que o jogador precisa tocar
   nunca e `position:fixed`. */
.gbtn{position:absolute;z-index:46;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:999px;border:0;padding:0;cursor:pointer;
  background:-webkit-linear-gradient(top,#ffe487,var(--sol));background:linear-gradient(#ffe487,var(--sol));
  -webkit-box-shadow:0 3px 0 #c99a12,0 4px 14px rgba(0,0,0,.4);box-shadow:0 3px 0 #c99a12,0 4px 14px rgba(0,0,0,.4);
  -webkit-animation:gfnasce .25s ease-out;animation:gfnasce .25s ease-out}
.gbtn svg{display:block;width:28px;height:28px;margin:9px auto}
.gbtn:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.gbtn.escondido{display:none}
@-webkit-keyframes gfnasce{0%{-webkit-transform:scale(.4);opacity:0}70%{-webkit-transform:scale(1.12)}100%{-webkit-transform:scale(1);opacity:1}}
@keyframes gfnasce{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* ⭐ ACABAMENTO — regra 4: O DESTINO ACENDE TAMBEM NO TOQUE. A vaga so acendia
   quando a peca passava por cima ARRASTANDO; quem joga tocando (a maioria, no
   PC da escola) escolhia a peca e a mesa nao respondia nada.
   ⚠️ o brilho da vaga NAO pode ser `transform`: a vaga ja usa `rotate` inline
   para ficar no angulo certo, e animacao ganha do inline (foi o defeito das
   pecas que nao giravam). Aqui pulsa a OPACIDADE e muda o preenchimento.    */
@-webkit-keyframes tserveop{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes tserveop{0%,100%{opacity:.72}50%{opacity:1}}
.tvg.serve{-webkit-animation:tserveop .85s ease-in-out infinite;animation:tserveop .85s ease-in-out infinite}
.tvg.serve polygon{fill:rgba(255,201,42,.42);stroke:#e8930b;stroke-width:.11;stroke-dasharray:none}
/* ⭐ SILHUETA CHEIA (rachacuca): a vaga `.tsil` mostra so a forma escura unida.
   Na DICA, `.revela` traz de volta as DIVISOES pontilhadas (o guiado como apoio,
   nao de graca). CSS vence o atributo inline do <polygon>. */
/* na silhueta cheia a vaga NAO respira (a respiracao abria "buracos" na forma
   solida); ela e uma silhueta estavel. A respiracao volta so quando revelada. */
.tvg.tsil{-webkit-animation:none;animation:none}
.tvg.tsil.revela{-webkit-animation:tresp 2.4s ease-in-out infinite;animation:tresp 2.4s ease-in-out infinite}
.tvg.tsil polygon{-webkit-transition:fill .25s;transition:fill .25s}
.tvg.tsil.revela polygon{fill:rgba(120,110,90,.16);stroke:#8a7f68;stroke-dasharray:.18 .13}
/* ⭐ ACABAMENTO — regra 6: A PRIMEIRA VEZ SE DEMONSTRA. Um dedo desenhado sai
   da peca, anda ate a vaga e "toca" — uma vez so, na figura 1. Ninguem le
   instrucao de jogo; todo mundo entende gesto.                              */
.dedodemo{position:fixed;z-index:60;width:46px;height:46px;pointer-events:none;margin:-6px 0 0 -10px;
  -webkit-transition:left 1s ease-in-out,top 1s ease-in-out;transition:left 1s ease-in-out,top 1s ease-in-out;
  -webkit-filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
.dedodemo svg{display:block;width:100%;height:100%}
.dedodemo.toca{-webkit-animation:dtoca .45s ease-out;animation:dtoca .45s ease-out}
@-webkit-keyframes dtoca{0%,100%{-webkit-transform:scale(1)}45%{-webkit-transform:scale(.76)}}
@keyframes dtoca{0%,100%{transform:scale(1)}45%{transform:scale(.76)}}
.ondademo{position:fixed;z-index:59;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:999px;
  border:3px solid var(--sol);pointer-events:none;
  -webkit-animation:donda .65s ease-out forwards;animation:donda .65s ease-out forwards}
@-webkit-keyframes donda{0%{-webkit-transform:scale(.4);opacity:1}100%{-webkit-transform:scale(3.6);opacity:0}}
@keyframes donda{0%{transform:scale(.4);opacity:1}100%{transform:scale(3.6);opacity:0}}
.tplacar{font-weight:800;color:#2c6b13;background:var(--card);border:2px solid var(--linha);
  border-radius:12px;padding:4px 12px;margin:2px auto 0;display:inline-block;font-size:14px}
/* ===== ARRASTAR A LETRA (a peca vai na mao ate a lacuna) ===== */
.pecas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:12px;-webkit-box-pack:center;justify-content:center;margin-top:14px}
.peca{width:62px;height:66px;border-radius:14px;background:rgba(255,253,246,.97);border:2px solid var(--linha);border-bottom-width:5px;text-align:center;line-height:60px;font-size:30px;font-weight:700;color:var(--texto);cursor:grab;-webkit-box-shadow:0 5px 12px rgba(30,50,20,.18);box-shadow:0 5px 12px rgba(30,50,20,.18)}
.peca.sel{border-color:var(--sol);background:#fff7d6}
.peca.usada{opacity:.28}
.peca.voa{position:fixed;z-index:40;pointer-events:none;opacity:.95;-webkit-transform:scale(1.06);transform:scale(1.06)}
/* a figura dentro do cartao de ligar: cabe inteira, sem esticar */
.figLig{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto}
.tvaga{display:inline-block;min-width:46px;height:54px;line-height:50px;border-radius:12px;background:rgba(255,253,246,.93);border:2px dashed #b9a97f;font-size:28px;font-weight:700;color:var(--texto);vertical-align:middle}
.tvaga.sob{border-color:var(--sol);background:#fff7d6;border-style:solid}
.tvaga.cheia{border:2px solid var(--verde);border-bottom-width:4px;color:var(--verde-d);background:var(--card)}
.tvaga.errou{border-color:var(--coral);background:#ffece9;-webkit-animation:shk .4s;animation:shk .4s}
/* ===== MECANICAS EXTRAS: caca-palavras / montar / memoria / relampago ===== */
.grade{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;width:100%;max-width:340px;margin-top:8px;background:rgba(255,253,246,.96);border:2px solid var(--linha);border-radius:16px;padding:6px;-webkit-box-shadow:0 6px 14px rgba(30,50,20,.18);box-shadow:0 6px 14px rgba(30,50,20,.18)}
.cel{width:16.66%;height:46px;line-height:46px;text-align:center;font-size:18px;font-weight:700;cursor:pointer;color:#5a5346;border-radius:8px}
.cel.sel{background:var(--sol);color:#5a4200}
.cel.ok{background:#cdf0bd;color:#2c6b13}
/* ⭐ CADA PALAVRA ACHADA GANHA A SUA COR (pedido do Marcos, ago/2026: *"tem que
   colorir diferente as palavras encontradas... fantastico para os pequenos"*).
   Antes as seis saiam todas do mesmo verde: a crianca achava a terceira e a
   grade nao mudava de conversa. Com cor propria ela VE o que ja conquistou, e o
   chip da lista embaixo acende na MESMA cor — e a ligacao entre a palavra e o
   lugar dela no quadro. Todos os pares tem letra escura sobre fundo claro para
   passar no portao de contraste. */
.cel.ok1,.pchip.feito1{background:#cdf0bd;color:#2c6b13}
.cel.ok2,.pchip.feito2{background:#cfe6ff;color:#10457f}
.cel.ok3,.pchip.feito3{background:#ffd6e7;color:#8a1c4d}
.cel.ok4,.pchip.feito4{background:#ffe9a8;color:#6b4a00}
.cel.ok5,.pchip.feito5{background:#e2d7ff;color:#4a2a8f}
.cel.ok6,.pchip.feito6{background:#ffdcc0;color:#8a3a00}
/* a palavra recem-achada PULA — o olho vai nela sem precisar de seta */
.cel.pulou{-webkit-animation:cacapula .45s ease;animation:cacapula .45s ease}
@-webkit-keyframes cacapula{0%,100%{-webkit-transform:scale(1)}45%{-webkit-transform:scale(1.22)}}
@keyframes cacapula{0%,100%{transform:scale(1)}45%{transform:scale(1.22)}}
@media (prefers-reduced-motion:reduce){ .cel.pulou{-webkit-animation:none;animation:none} }
.cel.no{background:#ffd3cd;color:#8e2418}
.lista{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;-webkit-box-pack:center;justify-content:center;margin-top:10px;max-width:340px}
.pchip{background:rgba(255,253,246,.95);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--texto);-webkit-box-shadow:0 3px 8px rgba(30,50,20,.18);box-shadow:0 3px 8px rgba(30,50,20,.18)}
/* ⚠️ so o RISCO fica aqui: a COR do chip vem da classe numerada (.feito1..6),
   senao esta regra — que vem depois no arquivo e tem a mesma forca — pintava
   os seis chips do mesmo verde e a ligacao com a cor da palavra se perdia.
   Foi o que aconteceu na primeira tentativa, e so a medicao no navegador
   mostrou: a grade tinha duas cores e a lista embaixo, uma so. */
.pchip.feito{text-decoration:line-through}
.slots{display:-webkit-box;display:-webkit-flex;display:flex;gap:8px;-webkit-box-pack:center;justify-content:center;margin-top:12px}
/* ⚠️ a lacuna vazia tinha fundo com 32% de opacidade: a rua de pedra do

   escrever e papel: opaco, com a borda tracejada por cima. */
.slot{width:46px;height:52px;border-radius:12px;background:rgba(255,253,246,.93);border:2px dashed #b9a97f;text-align:center;line-height:48px;font-size:26px;font-weight:700;color:var(--texto);-webkit-box-shadow:0 3px 8px rgba(30,50,20,.16);box-shadow:0 3px 8px rgba(30,50,20,.16)}
.slot.cheio{background:var(--card);border:2px solid var(--verde);border-bottom-width:4px;color:var(--verde-d);-webkit-animation:pop .3s;animation:pop .3s}
.letras{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:9px;-webkit-box-pack:center;justify-content:center;margin-top:16px;max-width:340px}
.tec{width:50px;height:56px;border-radius:14px;background:rgba(255,253,246,.96);border:2px solid var(--linha);border-bottom-width:5px;text-align:center;line-height:50px;font-size:26px;font-weight:700;color:var(--texto);cursor:pointer;-webkit-box-shadow:0 5px 12px rgba(30,50,20,.18);box-shadow:0 5px 12px rgba(30,50,20,.18)}
.tec:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.tec.usada{opacity:.25}
.tec.no{border-color:var(--coral);background:#ffece9;-webkit-animation:shk .4s;animation:shk .4s}
.mcartas{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:10px;-webkit-box-pack:center;justify-content:center;margin-top:12px;max-width:430px;width:100%}
.mcarta{width:48%;max-width:210px;height:104px;min-height:104px;border-radius:16px;cursor:pointer;padding:0;background:none;border:0;-webkit-perspective:700px;perspective:700px}
.mcin{position:relative;width:100%;height:100%;-webkit-transition:-webkit-transform .35s;transition:transform .35s;-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
.mcarta.vira .mcin{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.mface{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;padding:5px;text-align:center;line-height:1.2;overflow:hidden;-webkit-box-shadow:0 5px 12px rgba(30,50,20,.2);box-shadow:0 5px 12px rgba(30,50,20,.2)}
.mtras{background:-webkit-linear-gradient(top,#8be05a,var(--verde));background:linear-gradient(#8be05a,var(--verde));border:2px solid var(--verde-d);color:#fff}
/* o brilho que corre pelo verso: e ele que chama a crianca para a carta */
.mtras:after{content:"";position:absolute;top:-30%;left:-70%;width:45%;height:170%;background:-webkit-linear-gradient(left,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));-webkit-transform:rotate(14deg);transform:rotate(14deg);-webkit-animation:mbri 3.2s linear infinite;animation:mbri 3.2s linear infinite}
@-webkit-keyframes mbri{0%{left:-70%}60%,100%{left:130%}}
@keyframes mbri{0%{left:-70%}60%,100%{left:130%}}
.mfrente{-webkit-transform:rotateY(180deg);transform:rotateY(180deg);background:var(--card);border:2px solid var(--linha);color:var(--texto);font-size:13px;font-weight:700}
.mcarta.par .mfrente{background:#cdf0bd;border-color:var(--verde);color:#2c6b13;-webkit-animation:mpul .5s 2;animation:mpul .5s 2}
@-webkit-keyframes mpul{50%{-webkit-transform:rotateY(180deg) scale(1.07)}}
@keyframes mpul{50%{transform:rotateY(180deg) scale(1.07)}}
/* ⚠️ o verde da casa (--verde-d) da 3.5:1 sobre o cartao claro: abaixo do
   minimo de 4.5 que a crianca precisa para enxergar. Verde ESCURO aqui. */
.mplacar{font-weight:800;color:#2c6b13;background:var(--card);border:2px solid var(--linha);border-radius:12px;padding:4px 12px;margin:2px auto 0;display:inline-block;font-size:14px}
/* PC velho sem 3D de verdade: a carta TROCA de face em vez de girar. Sem
   isto ela ficaria virada de costas para sempre e a fase travava. */
@supports not ((transform-style:preserve-3d) or (-webkit-transform-style:preserve-3d)){
  .mcarta.vira .mcin{-webkit-transform:none;transform:none}
  .mfrente{-webkit-transform:none;transform:none;opacity:0}
  .mcarta.vira .mfrente{opacity:1;z-index:2}
}
.mcarta.no{-webkit-animation:shk .4s;animation:shk .4s}
/* ⚠️ a carta e um flex EM LINHA: sem virar coluna, a figura fica AO LADO da

.mmot{display:block;font-size:11px;line-height:1.15;margin-top:3px;font-weight:400;color:#5b4632}

.tbar{width:250px;height:14px;background:rgba(255,255,255,.55);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.tbar>i{display:block;height:100%;width:100%;background:-webkit-linear-gradient(left,#ef5a4a,var(--sol));background:linear-gradient(90deg,#ef5a4a,var(--sol))}
.placar{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;display:inline-block;padding:3px 12px;border-radius:999px;background:rgba(30,27,18,.78)}

  (function(){

/* ⭐ O AUDITOR-JOGADOR PRECISA CONSEGUIR RESOLVER. Um tangram no chute e
   impossivel: ele clicaria 5200 vezes sem fechar uma figura, e a bancada diria
   "PRESO" numa fase que a crianca fecha. Entao a tela PUBLICA o caminho:
   a peca que serve alguma vaga vazia AGORA ganha `data-qa`, e a vaga tambem.
   Se nenhuma peca serve (todas precisam girar), quem ganha a marca e o BOTAO
   DE GIRAR — e assim ele gira ate servir. E o mesmo truque da peca do
   `_padrao/pecas/tangram.html`.                                            */
function marcaQA(){
  /* ⚠️ LICAO PAGA (ago/2026): eu marcava a PECA e a VAGA ao mesmo tempo, e o
     auditor-jogador clica sempre no PRIMEIRO `data-qa` da tela — que e a vaga,
     porque ela nasce antes no HTML. Ele batia na vaga para sempre, sem nunca
     pegar a peca, e dava "PRESO" na primeira figura.
     Marca-se UM alvo por vez, na ordem em que a crianca faz: primeiro a peca;
     com a peca na mao, a vaga dela. */
  if(!tmesa) return;
  var v=vagas(), p=document.getElementsByClassName("tpeca"), z, k;
  for(z=0;z<p.length;z++) p[z].removeAttribute("data-qa");
  for(z=0;z<v.length;z++) v[z].removeAttribute("data-qa");
  if(tflut) tflut.removeAttribute("data-qa");
  if(tesp) tesp.removeAttribute("data-qa");

  if(tsel && tsel.className.indexOf("posta")<0){
    /* ja tem peca na mao: ou existe vaga que ela serve, ou e para girar */
    for(z=0;z<v.length;z++){
      if(v[z].__cheia) continue;
      if(serveNa({f:tsel.__f,ang:tsel.__ang,esp:tsel.__esp}, v[z].__v)){
        v[z].setAttribute("data-qa","1"); return;
      }
    }
    if(tsel.__f==="par" && tesp && tesp.className.indexOf("escondido")<0){
      /* o paralelogramo pode precisar do outro lado: tenta girar 8x antes */
      var so=false,a2;
      for(a2=0;a2<8;a2++){
        for(z=0;z<v.length;z++){
          if(v[z].__cheia) continue;
          if(serveNa({f:tsel.__f,ang:(tsel.__ang+a2*45)%360,esp:tsel.__esp}, v[z].__v)) so=true;
        }
      }
      if(!so){ tesp.setAttribute("data-qa","1"); return; }
    }
    /* precisa girar: o alvo agora e o botao FLUTUANTE (o do rodape saiu) */
    if(tflut) tflut.setAttribute("data-qa","1");
    return;
  }

  /* nenhuma peca na mao: marca a que serve alguma vaga (ou qualquer uma) */
  for(z=0;z<v.length;z++){
    if(v[z].__cheia) continue;
    for(k=0;k<p.length;k++){
      if(p[k].className.indexOf("posta")>=0) continue;
      if(serveNa({f:p[k].__f,ang:p[k].__ang,esp:p[k].__esp}, v[z].__v)){
        p[k].setAttribute("data-qa","1"); return;
      }
    }
  }
  for(k=0;k<p.length;k++) if(p[k].className.indexOf("posta")<0){ p[k].setAttribute("data-qa","1"); return; }
}
function giraPeca(p){
  var tr="rotate("+p.__ang+"deg)"+(p.__esp?" scaleX(-1)":"");
  p.style.webkitTransform=tr; p.style.transform=tr;
}

var SETA_GIRO="<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M12.5 4.2V1.4L7.6 6.3l4.9 4.9V8.4a5.4 5.4 0 1 1-5.4 5.4H4.4a8.1 8.1 0 1 0 8.1-9.6z' fill='#5a4200'/></svg>";

/* ⭐ O BOTAO DE GIRAR FICA NA PECA (como no rachacuca), centralizado nela.
   Pedido do Marcos: "tem que ser na peca mesmo". O que dava clique errado antes
   era ele no CANTO, invadindo a peca vizinha. No CENTRO da peca escolhida ele
   nao sobra para fora dela — e, como girar e em torno do centro, o botao NAO
   SAI DO LUGAR ao girar. */
function tiraGiroFlut(){ if(tflut&&tflut.parentNode) tflut.parentNode.removeChild(tflut); tflut=null; }
function posGiroFlut(){
  if(!tflut||!tsel) return;
  var r=tsel.getBoundingClientRect();
  /* coordenada de PAGINA (o botao e position:absolute): soma o scroll, senao
     ele desliza quando a tela rola. */
  var sx=window.pageXOffset||document.documentElement.scrollLeft||0;
  var sy=window.pageYOffset||document.documentElement.scrollTop||0;
  tflut.style.left=(r.left+sx+r.width/2)+"px";
  tflut.style.top=(r.top+sy+r.height/2)+"px";
}
function poeGiroFlut(){
  tiraGiroFlut();
  if(!tsel||tsel.className.indexOf("posta")>=0) return;
  /* o quadrado e simetrico e sempre ang 0: girar so cria o losango que nao entra.
     sem botao de girar para ele — nasce alinhado e so precisa ser posicionado. */
  if(tsel.__f==="quad") return;
  tflut=el("button","gbtn",SETA_GIRO);
  tflut.setAttribute("aria-label","Girar a peça");
  tflut.onclick=function(ev){
    if(ev&&ev.stopPropagation) ev.stopPropagation();
    if(!tsel) return;
    arma(); tsel.__ang=normalG(tsel.__ang+45); giraPeca(tsel); sTap();
    setTimeout(function(){ acendeVagas(); posGiroFlut(); marcaQA(); },250);
  };
  document.body.appendChild(tflut);
  posGiroFlut();
}
if(window.addEventListener){
  window.addEventListener("scroll",function(){ posGiroFlut(); },false);
  window.addEventListener("resize",function(){ posGiroFlut(); },false);
}

/* a vaga que ESTA peca serve agora fica acesa — no toque tambem */
function acendeVagas(){
  var v=vagas(),z,c;
  var mao=(tsel&&tsel.className.indexOf("posta")<0)?{f:tsel.__f,ang:tsel.__ang,esp:tsel.__esp}:null;
  for(z=0;z<v.length;z++){
    if(v[z].__cheia) continue;

  pai.appendChild(cx);
  /* as barras crescem depois de entrar na tela (senao nao anima) */
  setTimeout(function(){ var q;
    for(q=0;q<barras.length;q++){ (function(b){
      setTimeout(function(){ b[0].style.width=b[1]+"%"; },b[2]);
    })(barras[q]); }
  },60);
  /* o numero de acertos sobe contando */
  if(tot>0){ var v=0,pa=Math.max(28,Math.round(1400/Math.max(1,acc)));

      if(!cx.parentNode){ clearInterval(tm); return; }

}

/* ⚠️ A ORDEM E O PULO DO GATO (ver _padrao/RETOMAR.md): o `TREINO` abaixo guarda
   as funcoes POR REFERENCIA. Se o envelope viesse depois, o "Treinar o que
   faltou" chamaria as versoes ANTIGAS e a retomada mentiria em silencio.    */
(function(){
  var extras=[["telaAbertura",""]], lista=FASES_MESTRE.concat(extras), i;
  for(i=0;i<lista.length;i++){(function(n){
    var f=window[n];
    if(typeof f!=="function") return;
    window[n]=function(){ marcaFase(n); return f.apply(this,arguments); };
  })(lista[i][0]);}
})();
/* ⚠️ "Treinar o que faltou" num JOGO de uma mecanica so: nao ha outra fase para
   onde mandar — o treino aqui e REFAZER a figura em que ela mais errou. Por
   isso o mapa aponta o unico conceito medido para a propria tela do jogo, e o
   `figI` volta para a figura mais dificil dela.                            */
var TREINO={montar:function(){ figI=Math.max(0,Math.min(figI,FIGURAS.length-1)); telaJogo(); }};
function TELAFIM(){ telaFim(); }
/* ---------- TREINAR SO O QUE FALTOU ----------
   Pergunta do Marcos (ago/2026): "se ela nao domina, ela consegue fazer so as
   atividades que nao domina?". Da: o app ja mede cada objetivo (DOM). Aqui ele
   monta um percurso CURTO so com as fases dos objetivos fracos e volta para a
   medalha no fim. A crianca nao repete o que ja sabe — isso e o que mantem ela
   na tarefa em vez de enjoar.
   Truque para nao mexer em nenhuma fase: enquanto o treino roda, o mostraBanner
   ignora o "proximo" original e chama a proxima fase da fila.               */
var FILATREINO=null;
var _bannerOriginal=mostraBanner;
mostraBanner=function(msg,cb){ _bannerOriginal(msg, FILATREINO ? proximoTreino : cb); };
function fracos(){
  var k,out=[];
  for(k in DOM){ if(DOM.hasOwnProperty(k)&&(DOM[k]||0)<0.75&&TREINO[k]) out.push(k); }
  return out;
}
function proximoTreino(){
  if(!FILATREINO||!FILATREINO.length){ FILATREINO=null; salvaEstado(); TELAFIM(); return; }
  var f=FILATREINO.shift();
  try{ f(); }catch(e){ proximoTreino(); }
}
function treinarFracos(){
  var f=fracos(),i,fila=[];
  for(i=0;i<f.length;i++) fila.push(TREINO[f[i]]);
  if(!fila.length){ TELAFIM(); return; }
  FILATREINO=fila; proximoTreino();
}
function pct(x){ return Math.round(x*100)+"%"; }

  h+="<div class='bloco'><b>Como ler:</b> a crian&#231;a n&#227;o fez prova. Tudo foi medido enquanto ela brincava: prever antes, testar, ordenar, classificar, apontar as partes e explicar no fim.</div>";
  h+="<p class='noprint'><button onclick='window.print()'>Imprimir</button> <button onclick='location.href=location.pathname'>Voltar ao jogo</button></p>";
  d.innerHTML=h;

}
